<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@500;700&display=swap');
        *{box-sizing:border-box}
        body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;margin:0;background:#f3ece3;color:#2f2a26;overflow-x:hidden}
        .topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding:12px 16px;background:#f8f3ed;border-bottom:1px solid #dfd3c6}
        .topbar a{color:#3b342f;text-decoration:none;font-weight:500;font-size:14px;padding:7px 14px;border-radius:999px;border:1px solid #d6c8b8;background:#fcf9f4}
        @media(max-width:768px){.topbar{display:none}}
        .hero-outer{padding:12px 0 0}
        .hero-inner{max-width:1400px;margin:0 auto;padding:0 18px}
        .wrap{max-width:1160px;margin:0 auto;padding:12px 18px calc(114px + env(safe-area-inset-bottom,0px))}
        .brand-title{
            font-family:"Cormorant Garamond","Times New Roman",serif;
            font-size:clamp(2.2rem,7vw,5rem);
            font-weight:700;
            color:#111;
            margin:4px 0 0;
            line-height:1.03;
            letter-spacing:.02em;
            text-wrap:balance;
            width:100%;
            max-width:1380px;
        }
        .brand-sub{
            font-family:"Manrope","Segoe UI",Roboto,Arial,sans-serif;
            font-size:clamp(1rem,2.1vw,1.35rem);
            font-weight:700;
            color:#5e5a56;
            margin:6px 0 16px;
            letter-spacing:.01em;
        }
        .hero{
            width:100%;
            aspect-ratio:16/9;
            min-height:160px;
            border-radius:0;
            background:#e7dbce;
            border-top:1px solid #dbcbbb;
            border-bottom:1px solid #dbcbbb;
            object-fit:cover;
            object-position:center;
            display:block
        }
        .hero-outer picture{display:block;width:100%;max-width:100%}
        @media(min-width:769px){
            .hero-outer picture{
                display:block;
                width:100%;
                border-top:1px solid #dbcbbb;
                border-bottom:1px solid #dbcbbb;
                background:#e7dbce;
            }
            img.hero{
                width:100%;
                max-width:100%;
                height:auto;
                aspect-ratio:unset;
                min-height:0;
                object-fit:contain;
                object-position:center;
                border-top:none;
                border-bottom:none;
                display:block;
            }
        }
        .grid{margin-top:18px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
        .card{display:block;text-decoration:none;color:inherit;background:#f9f4ed;border:1px solid #ddcfbf;border-radius:18px;padding:12px;box-shadow:0 4px 16px rgba(58,45,31,.07)}
        .card img{width:100%;height:150px;border-radius:12px;object-fit:cover;background:#efe3d4}
        .catalog-placeholder{width:100%;height:150px;border-radius:12px;background:#efe3d4}
        .card h3{margin:10px 0 6px;font-size:20px;color:#221f1c}
        .card p{margin:0;color:#645c55;font-size:14px}
        .weather-layer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:2}
        .particle{position:absolute;top:-10%;border-radius:50%;opacity:.85;animation:fall linear infinite}
        .particle.snow{background:#fff;box-shadow:0 0 8px rgba(255,255,255,.6)}
        .particle.leaf{background:transparent;font-size:14px;animation-name:fallLeaf}
        .sun{
            position:fixed;top:84px;right:28px;width:78px;height:78px;border-radius:50%;
            background:radial-gradient(circle,#fde68a 25%,#f59e0b 68%);
            box-shadow:0 0 45px rgba(245,158,11,.55);z-index:2;pointer-events:none
        }
        .sun::before{
            content:'';position:absolute;inset:-18px;border-radius:50%;
            border:2px dashed rgba(245,158,11,.55);animation:sunSpin 12s linear infinite
        }
        @keyframes fall{
            0%{transform:translateY(-12vh);opacity:0}
            10%{opacity:.95}
            100%{transform:translateY(112vh);opacity:.2}
        }
        @keyframes fallLeaf{
            0%{transform:translate(0,-12vh) rotate(0deg);opacity:0}
            10%{opacity:.95}
            100%{transform:translate(38px,112vh) rotate(220deg);opacity:.25}
        }
        @keyframes sunSpin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
        .mobile-nav{position:fixed;left:14px;right:14px;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:50;background:#f9f4ed;border:1px solid #d8caba;border-radius:16px;padding:11px 10px;display:none;justify-content:space-around;align-items:center;box-shadow:0 8px 30px rgba(43,34,28,.11)}
        .mobile-nav a{text-decoration:none;color:#4c443d;font-size:12px;font-weight:600}
        @media(max-width:768px){
            .mobile-nav{display:flex}
            .hero-inner,.wrap{padding-left:14px;padding-right:14px}
            .brand-sub{font-size:15px}
            .grid{grid-template-columns:1fr}
            .sun{top:18px;right:12px;width:60px;height:60px}
            .card img{
                height:auto;
                width:100%;
                display:block;
                object-fit:contain;
            }
            .catalog-placeholder{
                height:auto;
                aspect-ratio:4/3;
                min-height:120px;
            }
        }
    </style>
</head>
<body th:attr="data-weather=${weather}">
<div class="weather-layer" id="weatherLayer" aria-hidden="true"></div>
<div class="sun" id="summerSun" th:if="${weather == 'SUMMER'}"></div>
<nav class="topbar">
    <a th:href="@{/catalog}">Каталог</a>
    <a th:href="@{/about}">О бренде</a>
    <a th:href="@{/contacts}">Контакты</a>
    <a th:href="@{/admin}">Админ</a>
</nav>
<div class="hero-outer">
    <div class="hero-inner">
        <h1 class="brand-title">De&amp;Vi production</h1>
        <p class="brand-sub">Подарочные наборы для творчества</p>
    </div>
    <picture th:if="${(catalogHeaderImage != null and !#strings.isEmpty(catalogHeaderImage)) or (catalogHeaderImageMobile != null and !#strings.isEmpty(catalogHeaderImageMobile))}">
        <source media="(max-width: 768px)" th:srcset="${catalogHeaderImageMobile != null and !#strings.isEmpty(catalogHeaderImageMobile)} ? @{/files(path=${catalogHeaderImageMobile})} : @{/files(path=${catalogHeaderImage})}">
        <img class="hero" th:src="${catalogHeaderImage != null and !#strings.isEmpty(catalogHeaderImage)} ? @{/files(path=${catalogHeaderImage})} : @{/files(path=${catalogHeaderImageMobile})}" alt="Шапка каталога">
    </picture>
    <div class="hero" th:if="${(catalogHeaderImage == null or #strings.isEmpty(catalogHeaderImage)) and (catalogHeaderImageMobile == null or #strings.isEmpty(catalogHeaderImageMobile))}"></div>
</div>
<div class="wrap">
    <div class="grid">
        <a class="card" th:href="@{/catalog/{id}(id=${category.id})}" th:each="category : ${categories}">
            <img th:if="${category.imageFileName != null and !#strings.isEmpty(category.imageFileName)}" th:src="@{/files(path=${category.imageFileName})}" alt="Каталог">
            <div th:if="${category.imageFileName == null or #strings.isEmpty(category.imageFileName)}" class="catalog-placeholder"></div>
            <h3 th:text="${category.name}">Каталог</h3>
            <p th:text="'Товаров: ' + ${#lists.size(category.products)}">Товаров: 0</p>
        </a>
    </div>
</div>
<nav class="mobile-nav">
    <a th:href="@{/catalog}">Каталог</a>
    <a th:href="@{/about}">Бренд</a>
    <a th:href="@{/contacts}">Контакты</a>
</nav>
<script>
(function(){
    var weather=(document.body.getAttribute('data-weather')||'NONE').toUpperCase();
    var layer=document.getElementById('weatherLayer');
    if(!layer||weather==='NONE'||weather==='SUMMER'){return;}
    var count=weather==='WINTER'?64:40;
    for(var i=0;i<count;i++){
        var p=document.createElement('span');
        p.className='particle '+(weather==='WINTER'?'snow':'leaf');
        var left=Math.random()*100;
        var size=weather==='WINTER'?(2+Math.random()*5):(10+Math.random()*8);
        var duration=weather==='WINTER'?(5+Math.random()*8):(7+Math.random()*10);
        var delay=Math.random()*-duration;
        p.style.left=left+'vw';
        p.style.animationDuration=duration+'s';
        p.style.animationDelay=delay+'s';
        if(weather==='WINTER'){
            p.style.width=size+'px';
            p.style.height=size+'px';
        }else{
            p.textContent='🍂';
            p.style.fontSize=size+'px';
        }
        layer.appendChild(p);
    }
})();
</script>
</body>
</html>
