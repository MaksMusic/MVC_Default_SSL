<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ - Погода</title>
    <style>
        body{font-family:Inter,Arial,sans-serif;margin:0;background:#f3f6fb;color:#111827}
        .layout{display:flex;flex-direction:row-reverse;min-height:100vh}
        .sidebar{width:260px;background:#0f172a;color:#fff;padding:18px;position:sticky;top:0;height:100vh}
        .menu a{display:block;color:#cbd5e1;text-decoration:none;padding:10px;border-radius:10px;margin-bottom:6px}
        .menu a.active,.menu a:hover{background:#1e293b;color:#fff}
        .content{flex:1;padding:20px 20px 90px}
        @media(max-width:900px){.content{padding:20px 20px calc(130px + env(safe-area-inset-bottom,0px))}}
        .card{background:#fff;border-radius:14px;padding:14px;box-shadow:0 8px 20px rgba(2,6,23,.08)}
        label{display:block;margin-bottom:8px;font-weight:600}
        select,button{width:100%;padding:10px;border-radius:8px;border:1px solid #d1d5db;margin-bottom:8px}
        button{background:#1d4ed8;color:#fff;border:none;cursor:pointer}
        .hint{color:#64748b;font-size:14px}
        .admin-mfab-wrap{display:none}
        @media(max-width:900px){.layout{display:block}.sidebar{display:none}.admin-mfab-wrap{display:block}}
        .admin-mfab-backdrop{position:fixed;inset:0;z-index:998;background:rgba(15,23,42,.34);opacity:0;pointer-events:none;transition:opacity .2s ease}
        .admin-mfab-backdrop.open{opacity:1;pointer-events:auto}
        .admin-mfab-sheet{position:fixed;left:18px;right:18px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:999;max-height:min(52vh,340px);overflow-y:auto;background:#fff;border-radius:20px;padding:8px 0;border:1px solid #e2e8f0;box-shadow:0 16px 48px rgba(0,0,0,.2);transform:translateY(18px) scale(.98);opacity:0;pointer-events:none;transition:transform .22s ease,opacity .22s ease}
        .admin-mfab-sheet.open{transform:translateY(0) scale(1);opacity:1;pointer-events:auto}
        .admin-mfab-sheet a{display:block;padding:13px 20px;color:#0f172a;text-decoration:none;font-weight:600;font-size:15px}
        .admin-mfab-sheet a:hover,.admin-mfab-sheet a:focus{background:#f8fafc;outline:none}
        .admin-mfab-sheet a.active{background:#eff6ff;color:#1d4ed8}
        .admin-mfab-sheet hr{border:0;border-top:1px solid #e2e8f0;margin:8px 14px}
        .admin-mfab-btn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:1000;width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,#1d4ed8,#7c3aed);color:#fff;font-size:22px;line-height:1;box-shadow:0 10px 30px rgba(29,78,216,.42)}
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <h3>Админ-кабинет</h3>
        <nav class="menu">
            <a th:href="@{/admin/catalogs}">Каталоги</a>
            <a th:href="@{/admin/products}">Товары</a>
            <a th:href="@{/admin/reviews}">Отзывы</a>
            <a th:href="@{/admin/catalog-header}">Шапка сайта</a>
            <a th:href="@{/admin/contacts}">Контакты</a>
            <a th:href="@{/admin/brand}">О бренде</a>
            <a class="active" th:href="@{/admin/weather}">Погода</a>
            <a th:href="@{/admin/password}">Пароль</a>
            <a th:href="@{/}">На сайт</a>
            <a th:href="@{/logout}">Выйти</a>
        </nav>
    </aside>
    <main class="content">
        <h1>Погода на главной</h1>
        <section class="card">
            <form th:action="@{/admin/weather}" method="post">
                <label for="weather">Выберите режим:</label>
                <select id="weather" name="weather">
                    <option value="NONE" th:selected="${weather == 'NONE'}">Без погоды</option>
                    <option value="WINTER" th:selected="${weather == 'WINTER'}">Зима (снежинки)</option>
                    <option value="AUTUMN" th:selected="${weather == 'AUTUMN'}">Осень (листья)</option>
                    <option value="SUMMER" th:selected="${weather == 'SUMMER'}">Лето (солнце)</option>
                </select>
                <button type="submit">Сохранить</button>
            </form>
            <p class="hint">Настройка влияет только на главную страницу клиентов.</p>
        </section>
    </main>
</div>
<div class="admin-mfab-wrap">
    <div class="admin-mfab-backdrop" id="adminMfabBackdrop"></div>
    <nav class="admin-mfab-sheet" id="adminMfabSheet" aria-hidden="true">
        <a th:href="@{/admin/catalogs}" th:classappend="${activeMenu == 'catalogs'} ? 'active'">Каталоги</a>
        <a th:href="@{/admin/products}" th:classappend="${activeMenu == 'products'} ? 'active'">Товары</a>
        <a th:href="@{/admin/reviews}" th:classappend="${activeMenu == 'reviews'} ? 'active'">Отзывы</a>
        <a th:href="@{/admin/catalog-header}" th:classappend="${activeMenu == 'catalog-header'} ? 'active'">Шапка сайта</a>
        <a th:href="@{/admin/contacts}" th:classappend="${activeMenu == 'contacts'} ? 'active'">Контакты</a>
        <a th:href="@{/admin/brand}" th:classappend="${activeMenu == 'brand'} ? 'active'">О бренде</a>
        <a th:href="@{/admin/weather}" th:classappend="${activeMenu == 'weather'} ? 'active'">Погода</a>
        <a th:href="@{/admin/password}" th:classappend="${activeMenu == 'password'} ? 'active'">Пароль</a>
        <hr>
        <a th:href="@{/}">На сайт</a>
        <a th:href="@{/logout}">Выйти</a>
    </nav>
    <button type="button" class="admin-mfab-btn" id="adminMfabBtn" aria-expanded="false" aria-controls="adminMfabSheet" aria-label="Меню">☰</button>
</div>
<script>
(function(){
    var b=document.getElementById('adminMfabBackdrop'), s=document.getElementById('adminMfabSheet'), f=document.getElementById('adminMfabBtn');
    if(!f||!s||!b)return;
    function openM(){s.classList.add('open');b.classList.add('open');f.setAttribute('aria-expanded','true');s.setAttribute('aria-hidden','false');}
    function closeM(){s.classList.remove('open');b.classList.remove('open');f.setAttribute('aria-expanded','false');s.setAttribute('aria-hidden','true');}
    function toggleM(){s.classList.contains('open')?closeM():openM();}
    f.addEventListener('click',function(e){e.stopPropagation();toggleM();});
    b.addEventListener('click',closeM);
    s.querySelectorAll('a').forEach(function(a){a.addEventListener('click',closeM);});
})();
</script>
</body>
</html>
