<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${editMode} ? 'Редактирование товара' : 'Добавить товар'">Товар</title>
    <style>
        body{font-family:Inter,Arial,sans-serif;margin:0;background:#f3f6fb;color:#111827}
        .layout{display:flex;flex-direction:row-reverse;min-height:100vh}
        .sidebar{width:260px;background:#0f172a;color:#fff;padding:18px;position:sticky;top:0;height:100vh}
        .menu a{display:block;color:#cbd5e1;text-decoration:none;padding:10px;border-radius:10px;margin-bottom:6px}
        .menu a.active,.menu a:hover{background:#1e293b;color:#fff}
        .content{flex:1;padding:20px 20px 90px}
        @media(max-width:900px){.content{padding:20px 20px calc(130px + env(safe-area-inset-bottom,0px))}}
        .card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 8px 20px rgba(2,6,23,.08)}
        input,select,textarea,button{width:100%;padding:9px;border-radius:8px;border:1px solid #d1d5db;margin-bottom:8px}
        button{background:#1d4ed8;color:#fff;border:none;cursor:pointer}
        .inline-option{display:flex;gap:8px;align-items:center;margin:0 0 10px}
        .inline-option input{width:auto;margin:0}
        .inline-option label{margin:0}
        .admin-mfab-wrap{display:none}
        @media(max-width:900px){.layout{display:block}.sidebar{display:none}.admin-mfab-wrap{display:block}}
        .admin-mfab-backdrop{position:fixed;inset:0;z-index:998;background:rgba(15,23,42,.34);opacity:0;pointer-events:none;transition:opacity .2s ease}
        .admin-mfab-backdrop.open{opacity:1;pointer-events:auto}
        .admin-mfab-sheet{position:fixed;left:18px;right:18px;bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:999;max-height:min(52vh,340px);overflow-y:auto;background:#fff;border-radius:20px;padding:8px 0;border:1px solid #e2e8f0;box-shadow:0 16px 48px rgba(0,0,0,.2);transform:translateY(18px) scale(.98);opacity:0;pointer-events:none;transition:transform .22s ease,opacity .22s ease}
        .admin-mfab-sheet.open{transform:translateY(0) scale(1);opacity:1;pointer-events:auto}
        .admin-mfab-sheet a{display:block;padding:13px 20px;color:#0f172a;text-decoration:none;font-weight:600;font-size:15px}
        .admin-mfab-sheet a:hover,.admin-mfab-sheet a:focus{background:#f8fafc;outline:none}
        .admin-mfab-sheet a.active{background:#eff6ff;color:#1d4ed8}
        .admin-mfab-sheet hr{border:0;border-top:1px solid #e2e8f0;margin:8px 14px}
        .admin-mfab-btn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(26px + env(safe-area-inset-bottom,0px));z-index:1000;width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(135deg,#1d4ed8,#7c3aed);color:#fff;font-size:22px;line-height:1;box-shadow:0 10px 30px rgba(29,78,216,.42)}
        .admin-mfab-btn:active{transform:translateX(-50%) scale(.95)}
    </style>
</head>
<body>
<div class="layout">
    <aside class="sidebar">
        <h3>Админ-кабинет</h3>
        <nav class="menu">
            <a th:href="@{/admin/catalogs}">Каталоги</a>
            <a class="active" th:href="@{/admin/products}">Товары</a>
            <a th:href="@{/admin/contacts}">Контакты</a>
            <a th:href="@{/admin/brand}">О бренде</a>
            <a th:href="@{/}">На сайт</a>
            <a th:href="@{/logout}">Выйти</a>
        </nav>
    </aside>
    <main class="content">
        <h1 th:text="${editMode} ? 'Редактирование товара' : 'Добавление товара'">Товар</h1>
        <section class="card">
            <form th:action="${editMode} ? @{/admin/products/{id}/update(id=${product.id})} : @{/admin/products}"
                  method="post" enctype="multipart/form-data">
                <input name="name" th:value="${product.name}" placeholder="Название товара" required>
                <textarea name="shortDescription" placeholder="Описание" required th:text="${product.shortDescription}"></textarea>
                <input name="wbProductUrl" type="url" th:value="${product.wbProductUrl}" placeholder="Ссылка на товар на Wildberries (https://...)">
                <select name="categoryId" required>
                    <option value="">Выберите каталог</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${editMode and product.category != null and product.category.id == c.id}"></option>
                </select>

                <label>Картинка товара</label>
                <input name="imageFile" type="file" accept="image/*">
                <img th:if="${editMode and product.imageFileName != null and !#strings.isEmpty(product.imageFileName)}" th:src="@{/files(path=${product.imageFileName})}" alt="Фото" style="max-width:240px;border-radius:12px;margin-bottom:8px;">
                <div class="inline-option" th:if="${editMode and product.imageFileName != null and !#strings.isEmpty(product.imageFileName)}">
                    <input id="removeImage" name="removeImage" type="checkbox" value="true">
                    <label for="removeImage">Удалить текущую картинку</label>
                </div>

                <label>Видео товара</label>
                <input name="videoFile" type="file" accept="video/*">
                <video th:if="${editMode and product.videoFileName != null and !#strings.isEmpty(product.videoFileName)}" controls th:src="@{/files(path=${product.videoFileName})}" style="max-width:320px;margin-bottom:8px;"></video>
                <div class="inline-option" th:if="${editMode and product.videoFileName != null and !#strings.isEmpty(product.videoFileName)}">
                    <input id="removeVideo" name="removeVideo" type="checkbox" value="true">
                    <label for="removeVideo">Удалить текущее видео</label>
                </div>

                <label>Аудио товара</label>
                <input name="audioFile" type="file" accept="audio/*">
                <audio th:if="${editMode and product.audioFileName != null and !#strings.isEmpty(product.audioFileName)}" controls th:src="@{/files(path=${product.audioFileName})}" style="margin-bottom:8px;"></audio>
                <div class="inline-option" th:if="${editMode and product.audioFileName != null and !#strings.isEmpty(product.audioFileName)}">
                    <input id="removeAudio" name="removeAudio" type="checkbox" value="true">
                    <label for="removeAudio">Удалить текущее аудио</label>
                </div>

                <label>PDF инструкция (опционально)</label>
                <input name="instructionTitle" placeholder="Название инструкции">
                <input name="instructionFile" type="file" accept=".pdf,.doc,.docx">
                <div class="inline-option" th:if="${editMode and product.instructions != null and !#lists.isEmpty(product.instructions)}">
                    <input id="removeInstructionFiles" name="removeInstructionFiles" type="checkbox" value="true">
                    <label for="removeInstructionFiles">Удалить все файлы инструкций у товара</label>
                </div>
                <button type="submit" th:text="${editMode} ? 'Сохранить товар' : 'Добавить товар'">Сохранить</button>
            </form>
        </section>
    </main>
</div>
<div class="admin-mfab-wrap">
    <div class="admin-mfab-backdrop" id="adminMfabBackdrop"></div>
    <nav class="admin-mfab-sheet" id="adminMfabSheet" aria-hidden="true">
        <a th:href="@{/admin/catalogs}" th:classappend="${activeMenu == 'catalogs'} ? 'active'">Каталоги</a>
        <a th:href="@{/admin/products}" th:classappend="${activeMenu == 'products'} ? 'active'">Товары</a>
        <a th:href="@{/admin/contacts}" th:classappend="${activeMenu == 'contacts'} ? 'active'">Контакты</a>
        <a th:href="@{/admin/brand}" th:classappend="${activeMenu == 'brand'} ? 'active'">О бренде</a>
        <hr>
        <a th:href="@{/}">На сайт</a>
        <a th:href="@{/logout}">Выйти</a>
    </nav>
    <button type="button" class="admin-mfab-btn" id="adminMfabBtn" aria-expanded="false" aria-controls="adminMfabSheet" aria-label="Меню">☰</button>
</div>
<script>
(function(){
    var b=document.getElementById('adminMfabBackdrop'), s=document.getElementById('adminMfabSheet'), f=document.getElementById('adminMfabBtn');
    if(!f||!s||!b)return;
    function openM(){s.classList.add('open');b.classList.add('open');f.setAttribute('aria-expanded','true');s.setAttribute('aria-hidden','false');}
    function closeM(){s.classList.remove('open');b.classList.remove('open');f.setAttribute('aria-expanded','false');s.setAttribute('aria-hidden','true');}
    function toggleM(){s.classList.contains('open')?closeM():openM();}
    f.addEventListener('click',function(e){e.stopPropagation();toggleM();});
    b.addEventListener('click',closeM);
    s.querySelectorAll('a').forEach(function(a){a.addEventListener('click',closeM);});
})();
</script>
</body>
</html>
