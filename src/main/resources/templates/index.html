<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devi Guide</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(165deg, #f8fafc 0%, #eef2ff 40%, #f0f9ff 100%);
            color: #334155;
        }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
        }
        .topbar a {
            color: #475569;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 999px;
            border: 1px solid rgba(148, 163, 184, 0.35);
            background: #fff;
            transition: color 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .topbar a:hover {
            color: #2563eb;
            border-color: #93c5fd;
            box-shadow: 0 2px 12px rgba(37, 99, 235, 0.12);
        }
        .stage {
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 20px calc(120px + env(safe-area-inset-bottom, 0px));
        }
        .logo {
            font-size: clamp(2.5rem, 10vw, 4.5rem);
            font-weight: 800;
            letter-spacing: 0.06em;
            text-align: center;
            line-height: 1.1;
            background: linear-gradient(105deg, #2563eb, #7c3aed, #db2777);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 4px 20px rgba(124, 58, 237, 0.25));
            animation: popIn 1.1s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
                       floatSoft 4s ease-in-out 1.1s infinite;
            opacity: 0;
            transform: scale(0.4);
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.4) translateY(20px); }
            55% { opacity: 1; transform: scale(1.08) translateY(0); }
            75% { transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes floatSoft {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .mobile-nav {
            position: fixed;
            left: 14px;
            right: 14px;
            bottom: calc(28px + env(safe-area-inset-bottom, 0px));
            display: none;
            justify-content: space-around;
            align-items: center;
            padding: 12px 10px;
            background: rgba(255, 255, 255, 0.97);
            border: 1px solid rgba(148, 163, 184, 0.28);
            border-radius: 18px;
            box-shadow: 0 10px 36px rgba(15, 23, 42, 0.1);
            z-index: 50;
        }
        .mobile-nav a {
            text-decoration: none;
            color: #475569;
            font-size: 12px;
            font-weight: 600;
        }
        @media (max-width: 768px) {
            .topbar { display: none; }
            .mobile-nav { display: flex; }
        }
    </style>
</head>
<body>
<nav class="topbar">
    <a th:href="@{/}">Главная</a>
    <a th:href="@{/catalog}">Каталог</a>
    <a th:href="@{/about}">О бренде</a>
    <a th:href="@{/contacts}">Контакты</a>
    <a th:href="@{/admin}">Админ</a>
</nav>
<div class="stage">
    <div class="logo">Devi Guide</div>
</div>
<nav class="mobile-nav">
    <a th:href="@{/}">Главная</a>
    <a th:href="@{/catalog}">Каталог</a>
    <a th:href="@{/about}">Бренд</a>
    <a th:href="@{/contacts}">Контакты</a>
</nav>
</body>
</html>
