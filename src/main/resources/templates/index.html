<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devi Guide</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(165deg, #f8fafc 0%, #eef2ff 40%, #f0f9ff 100%);
            color: #334155;
        }
        .topbar {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            padding: 14px 20px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(148, 163, 184, 0.2);
            box-shadow: 0 1px 0 rgba(255, 255, 255, 0.8);
        }
        .topbar a {
            color: #475569;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 999px;
            border: 1px solid rgba(148, 163, 184, 0.35);
            background: #fff;
            transition: color 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .topbar a:hover {
            color: #2563eb;
            border-color: #93c5fd;
            box-shadow: 0 2px 12px rgba(37, 99, 235, 0.12);
        }
        .stage {
            min-height: calc(100vh - 72px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 20px calc(120px + env(safe-area-inset-bottom, 0px));
            position: relative;
            z-index: 2;
        }
        .logo {
            font-size: clamp(2.5rem, 10vw, 4.5rem);
            font-weight: 800;
            letter-spacing: 0.06em;
            text-align: center;
            line-height: 1.1;
            background: linear-gradient(105deg, #2563eb, #7c3aed, #db2777);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 4px 20px rgba(124, 58, 237, 0.25));
            animation: popIn .75s cubic-bezier(.22,.95,.3,1) forwards,
                       floatSoft 2.8s ease-in-out .75s infinite;
            opacity: 0;
            transform: scale(0.4);
            will-change: transform, opacity;
        }
        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.4) translateY(20px); }
            55% { opacity: 1; transform: scale(1.08) translateY(0); }
            75% { transform: scale(0.98); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes floatSoft {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        .weather-layer{
            position:fixed;
            inset:0;
            pointer-events:none;
            overflow:hidden;
            z-index:1;
        }
        .particle{
            position:absolute;
            top:-10%;
            border-radius:50%;
            opacity:.85;
            animation:fall linear infinite;
        }
        .particle.snow{
            background:#fff;
            box-shadow:0 0 8px rgba(255,255,255,.6);
        }
        .particle.leaf{
            background:transparent;
            font-size:14px;
            animation-name:fallLeaf;
        }
        .sun{
            position:fixed;
            top:84px;
            right:42px;
            width:84px;
            height:84px;
            border-radius:50%;
            background:radial-gradient(circle,#fde68a 25%,#f59e0b 68%);
            box-shadow:0 0 45px rgba(245,158,11,.55);
            z-index:1;
            pointer-events:none;
        }
        .sun::before{
            content:'';
            position:absolute;
            inset:-20px;
            border-radius:50%;
            border:2px dashed rgba(245,158,11,.55);
            animation:sunSpin 12s linear infinite;
        }
        @keyframes fall{
            0%{transform:translateY(-12vh);opacity:0}
            10%{opacity:.95}
            100%{transform:translateY(112vh);opacity:.2}
        }
        @keyframes fallLeaf{
            0%{transform:translate(0,-12vh) rotate(0deg);opacity:0}
            10%{opacity:.95}
            100%{transform:translate(38px,112vh) rotate(220deg);opacity:.25}
        }
        @keyframes sunSpin{
            from{transform:rotate(0deg)}
            to{transform:rotate(360deg)}
        }
        .mobile-nav {
            position: fixed;
            left: 14px;
            right: 14px;
            bottom: calc(28px + env(safe-area-inset-bottom, 0px));
            display: none;
            justify-content: space-around;
            align-items: center;
            padding: 12px 10px;
            background: rgba(255, 255, 255, 0.97);
            border: 1px solid rgba(148, 163, 184, 0.28);
            border-radius: 18px;
            box-shadow: 0 10px 36px rgba(15, 23, 42, 0.1);
            z-index: 50;
        }
        .mobile-nav a {
            text-decoration: none;
            color: #475569;
            font-size: 12px;
            font-weight: 600;
        }
        @media (max-width: 768px) {
            .topbar { display: none; }
            .mobile-nav { display: flex; }
        }
    </style>
</head>
<body th:attr="data-weather=${weather}">
<nav class="topbar">
    <a th:href="@{/}">Главная</a>
    <a th:href="@{/catalog}">Каталог</a>
    <a th:href="@{/about}">О бренде</a>
    <a th:href="@{/contacts}">Контакты</a>
    <a th:href="@{/admin}">Админ</a>
</nav>
<div class="weather-layer" id="weatherLayer" aria-hidden="true"></div>
<div class="sun" id="summerSun" th:if="${weather == 'SUMMER'}"></div>
<div class="stage">
    <div class="logo">Devi Guide</div>
</div>
<nav class="mobile-nav">
    <a th:href="@{/}">Главная</a>
    <a th:href="@{/catalog}">Каталог</a>
    <a th:href="@{/about}">Бренд</a>
    <a th:href="@{/contacts}">Контакты</a>
</nav>
<script>
(function(){
    var weather=(document.body.getAttribute('data-weather')||'NONE').toUpperCase();
    var layer=document.getElementById('weatherLayer');
    if(!layer||weather==='NONE'||weather==='SUMMER'){return;}
    var count=weather==='WINTER'?64:40;
    for(var i=0;i<count;i++){
        var p=document.createElement('span');
        p.className='particle '+(weather==='WINTER'?'snow':'leaf');
        var left=Math.random()*100;
        var size=weather==='WINTER'?(2+Math.random()*5):(10+Math.random()*8);
        var duration=weather==='WINTER'?(5+Math.random()*8):(7+Math.random()*10);
        var delay=Math.random()*-duration;
        p.style.left=left+'vw';
        p.style.animationDuration=duration+'s';
        p.style.animationDelay=delay+'s';
        if(weather==='WINTER'){
            p.style.width=size+'px';
            p.style.height=size+'px';
        }else{
            p.textContent='🍂';
            p.style.fontSize=size+'px';
        }
        layer.appendChild(p);
    }
})();
</script>
</body>
</html>
