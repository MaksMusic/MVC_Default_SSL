# Email sender settings
app.email.from=administration@example.ru
app.email.from-name=email_name

# Disable mail health check
management.health.mail.enabled=false

# File upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Local storage for uploaded instruction files
app.storage.upload-dir=uploads

# Admin account for Spring Security
app.admin.username=admin
app.admin.password=admin123