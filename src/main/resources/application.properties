# Email sender settings
app.email.from=administration@example.ru
app.email.from-name=email_name

# Disable mail health check
management.health.mail.enabled=false

# File upload configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=300MB

# Local storage for uploaded instruction files
app.storage.upload-dir=${APP_STORAGE_UPLOAD_DIR:uploads}

# Admin account for Spring Security
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password=${APP_ADMIN_PASSWORD:admin123}